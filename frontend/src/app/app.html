<app-header />
<div>
    <app-sensor-card title="Temperature: " [value]="latestReading()?.temperature ?? 'N/A'" />
    <app-sensor-card title="Humidity: " [value]="latestReading()?.humidity ?? 'N/A'" />
    <app-sensor-card title="CO2Ppm: " [value]="latestReading()?.co2Ppm ?? 'N/A'" />

    <app-anomaly-list [anomalies] = "anomalyList()"/>
</div>
