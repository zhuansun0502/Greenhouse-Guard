<div class="container">
    <app-header class="header" />
    <div class="content">
        <div class="cards">
            <app-sensor-card title="Temperature (°C): " [timestamp]="latestReading()?.timestamp"
                [value]="latestReading()?.temperature" />
            <app-sensor-card title="Humidity (%): " [timestamp]="latestReading()?.timestamp"
                [value]="latestReading()?.humidity" />
            <app-sensor-card title="CO2Ppm (ppm): " [timestamp]="latestReading()?.timestamp"
                [value]="latestReading()?.co2Ppm" />
        </div>
        <app-anomaly-list [anomalies]="anomalyList() ?? []" />
    </div>
</div>
