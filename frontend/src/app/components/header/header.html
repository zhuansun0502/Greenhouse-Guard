<header class="header">
  <h1>Greenhouse Monitor</h1>

  <div class="meta">
    <span class="last-update">
      Last updated: {{ (latestReading()?.timestamp | date: 'medium') ?? 'N/A' }}
    </span>

    <span class="badge">
      <span [class]="'dot ' + connectionStatus()"></span>
      Connection Status: {{ connectionStatus() ?? 'N/A' }}
    </span>
  </div>
</header>
